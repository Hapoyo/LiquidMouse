<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>LiquidControl</title>
    <link rel="stylesheet" href="xterm.css">
    <!-- defer: 283 KB che bloccavano il primo render anche per chi apre solo il
         touchpad e non tocca mai il terminale. Sicuro perche' `Terminal` viene
         usato solo dentro initXterm(), invocata dall'apertura del tab o dal
         gestore di `load`, entrambi successivi agli script deferiti. -->
    <script src="xterm.js" defer></script>
    <link rel="stylesheet" href="app.css">
    <script src="app.js" defer></script>
</head>

<body>

    <div id="tab-bar">
        <button class="tab-btn active" id="tab-touchpad" onclick="switchTab('touchpad')">🖱️</button>
        <button class="tab-btn" id="tab-terminal" onclick="switchTab('terminal')">💻<span class="tab-dot" id="tab-terminal-dot" style="display:none"></span></button>
    </div>

    <div id="content-touchpad" class="tab-content active">

    <div class="config-panel hidden" id="configPanel">
        <div class="config-content">
            <h1>🖱️ Liquid Mouse</h1>
            <p>Configurazione Indirizzo IP Server Host</p>
            <input type="text" id="ipInput" class="config-input" placeholder="Esempio: 192.168.1.100"
                autocomplete="off">
            <input type="text" id="pinInput" class="config-input" placeholder="PIN (solo per accesso remoto)"
                autocomplete="off" autocorrect="off" autocapitalize="off"
                style="margin-top:8px;font-size:14px;letter-spacing:2px;">
            <div id="cert-hint" style="display:none;color:rgba(255,200,100,0.8);font-size:11px;margin:6px 0 0;text-align:center;">
                ⚠ Certificato non attendibile? Apri prima <span id="cert-link" style="text-decoration:underline;cursor:pointer;"></span> e accetta.
            </div>
            <button class="config-btn" id="connectBtn">STABILISCI CONNESSIONE</button>
        </div>
    </div>

    <div id="status">In attesa...</div>
    <div id="text-display"></div>
    <input type="text" id="hidden-input" autocomplete="off" autocorrect="off" autocapitalize="off">

    <div class="touchpad-container">
        <div id="touchpad" class="fluid-panel"></div>
    </div>

    <div class="buttons-container">
        <div id="btn-menu" class="fluid-panel mouse-btn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="2"></circle>
                <circle cx="19" cy="12" r="2"></circle>
                <circle cx="5" cy="12" r="2"></circle>
            </svg>
        </div>
    </div>

    <div id="menu-overlay">
        <div class="arrow-grid">
            <div id="btn-esc" class="fluid-panel menu-btn-item">
                <span style="font-weight: 700; font-size: 13px;">ESC</span>
            </div>
            <div id="btn-copy" class="fluid-panel menu-btn-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
            </div>
            <div id="btn-paste" class="fluid-panel menu-btn-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
                    <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
                </svg>
            </div>

            <div id="btn-ctrl" class="fluid-panel menu-btn-item">
                <span style="font-weight: 700; font-size: 13px;">CTRL</span>
            </div>
            <div id="btn-keyboard" class="fluid-panel menu-btn-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                    stroke-linejoin="round">
                    <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                    <path d="M6 8h.01M10 8h.01M14 8h.01M18 8h.01M6 12h.01M10 12h.01M14 12h.01M18 12h.01M7 16h10" />
                </svg>
            </div>
            <div id="btn-shift" class="fluid-panel menu-btn-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="M12 19V5M5 12l7-7 7 7" />
                </svg>
            </div>

            <div id="btn-select-all" class="fluid-panel menu-btn-item">
                <span style="font-size: 11px; line-height: 1.1;"><b>SELEZIONA</b><br>TUTTO</span>
            </div>
            <div id="btn-win" class="fluid-panel menu-btn-item">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M3 5.5L10.5 4.5V11.5H3V5.5ZM11.5 4.35L21 3V11.5H11.5V4.35ZM3 12.5H10.5V19.5L3 18.5V12.5ZM11.5 12.5H21V21L11.5 19.65V12.5Z"/>
                </svg>
                <span style="font-size: 11px; margin-top: 2px;">WIN</span>
            </div>
            <div id="btn-drag" class="fluid-panel menu-btn-item"
                style="color: #ffcc00; flex-direction: row; gap: 10px;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                <span style="font-weight: bold; font-size: 14px;">TRASCINA</span>
            </div>

            <div id="btn-media-play" class="fluid-panel menu-btn-item span-2">
                <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24" style="margin-right:8px;">
                    <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                </svg>
                <span style="font-weight:bold;font-size:13px;">PLAY / PAUSA</span>
            </div>
            <div id="btn-winv" class="fluid-panel menu-btn-item">
                <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18" style="margin-bottom:2px;">
                    <path d="M3 5.5L10.5 4.5V11.5H3V5.5ZM11.5 4.35L21 3V11.5H11.5V4.35ZM3 12.5H10.5V19.5L3 18.5V12.5ZM11.5 12.5H21V21L11.5 19.65V12.5Z"/>
                </svg>
                <span style="font-size:11px;font-weight:700;">+V</span>
            </div>
        </div>
        <div style="position:absolute;bottom:30px;width:min(85vw,350px);left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.45);font-size:11px;letter-spacing:1px;">
            <div style="display:flex;justify-content:space-between;margin-bottom:6px;text-transform:uppercase;">
                <span>Velocita Cursore</span>
                <span id="sens-value"></span>
            </div>
            <input type="range" id="sensitivity-slider" min="0.5" max="4.0" step="0.1"
                style="width:100%;accent-color:rgba(136,255,204,0.8);cursor:pointer;">
        </div>
    </div>

    </div><!-- #content-touchpad -->

    <div id="content-terminal" class="tab-content">
        <div id="term-error-banner"></div>

        <div id="session-picker">
            <div style="color:rgba(255,255,255,0.3);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px">Terminal Mode</div>
            <div id="session-list" style="width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px"></div>
        </div>

        <div id="terminal-active">
            <div id="xterm-container"></div>
            <div id="bottom-bar">
                <div id="session-dot-bar"></div>
            </div>
            <input type="text" id="term-kbd-input" autocomplete="off" autocorrect="off" autocapitalize="off">
        </div>
    </div><!-- #content-terminal -->

</body>

</html>
