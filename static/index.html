<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1d1815">
    <title>Liquid Mouse</title>
    <link rel="icon" href="icon.ico">
    <link rel="stylesheet" href="xterm.css">
    <!-- defer: 283 KB che bloccavano il primo render anche per chi apre solo il
         touchpad e non tocca mai il terminale. Sicuro perche' `Terminal` viene
         usato solo dentro initXterm(), invocata dall'apertura del tab o dal
         gestore di `load`, entrambi successivi agli script deferiti. -->
    <script src="xterm.js" defer></script>
    <link rel="stylesheet" href="app.css">
    <script src="app.js" defer></script>
</head>

<body>

    <div id="tab-bar">
        <button class="tab-btn active" id="tab-touchpad" onclick="switchTab('touchpad')">
            <span class="tab-num">001</span><span class="tab-name">touchpad</span>
        </button>
        <button class="tab-btn" id="tab-terminal" onclick="switchTab('terminal')">
            <span class="tab-num">002</span><span class="tab-name">terminale</span>
            <span class="tab-dot" id="tab-terminal-dot" style="display:none"></span>
        </button>
    </div>

    <div id="content-touchpad" class="tab-content active">

    <div class="config-panel hidden" id="configPanel">
        <div class="config-content">
            <div class="label">000 // connessione</div>
            <h1>Liquid Mouse</h1>
            <div class="label">indirizzo ip del pc</div>
            <input type="text" id="ipInput" class="config-input" placeholder="192.168.1.100"
                autocomplete="off">
            <div class="label">pin (solo accesso remoto)</div>
            <input type="text" id="pinInput" class="config-input" placeholder="dal qr remoto"
                autocomplete="off" autocorrect="off" autocapitalize="off">
            <div id="cert-hint">
                certificato non attendibile? apri prima <span id="cert-link"></span> e accetta.
            </div>
            <button class="config-btn" id="connectBtn">connetti</button>
        </div>
    </div>

    <div id="status">In attesa...</div>
    <div id="text-display"></div>
    <input type="text" id="hidden-input" autocomplete="off" autocorrect="off" autocapitalize="off">

    <div class="touchpad-container">
        <div id="touchpad" class="fluid-panel"></div>
    </div>

    <div class="buttons-container">
        <div id="btn-menu" class="fluid-panel mouse-btn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="2"></circle>
                <circle cx="19" cy="12" r="2"></circle>
                <circle cx="5" cy="12" r="2"></circle>
            </svg>
            <span>menu</span>
        </div>
    </div>

    <div id="menu-overlay">
        <div class="arrow-grid">
            <div id="btn-esc" class="fluid-panel menu-btn-item">
                <span class="key">esc</span>
            </div>
            <div id="btn-copy" class="fluid-panel menu-btn-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
                <span>copia</span>
            </div>
            <div id="btn-paste" class="fluid-panel menu-btn-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
                    <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
                </svg>
                <span>incolla</span>
            </div>

            <div id="btn-ctrl" class="fluid-panel menu-btn-item">
                <span class="key">ctrl</span>
            </div>
            <div id="btn-keyboard" class="fluid-panel menu-btn-item fill-orange">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                    stroke-linejoin="round">
                    <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                    <path d="M6 8h.01M10 8h.01M14 8h.01M18 8h.01M6 12h.01M10 12h.01M14 12h.01M18 12h.01M7 16h10" />
                </svg>
                <span>tastiera</span>
            </div>
            <div id="btn-shift" class="fluid-panel menu-btn-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="M12 19V5M5 12l7-7 7 7" />
                </svg>
                <span>shift</span>
            </div>

            <div id="btn-select-all" class="fluid-panel menu-btn-item">
                <span class="key">all</span>
                <span>seleziona</span>
            </div>
            <div id="btn-win" class="fluid-panel menu-btn-item">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M3 5.5L10.5 4.5V11.5H3V5.5ZM11.5 4.35L21 3V11.5H11.5V4.35ZM3 12.5H10.5V19.5L3 18.5V12.5ZM11.5 12.5H21V21L11.5 19.65V12.5Z"/>
                </svg>
                <span>win</span>
            </div>
            <div id="btn-drag" class="fluid-panel menu-btn-item edge-amber">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                <span>trascina</span>
            </div>

            <div id="btn-media-play" class="fluid-panel menu-btn-item span-2 fill-cream">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                </svg>
                <span>play / pausa</span>
            </div>
            <div id="btn-winv" class="fluid-panel menu-btn-item">
                <span class="key">win+v</span>
                <span>appunti</span>
            </div>
        </div>
        <div class="sens-box">
            <div class="sens-head">
                <span>velocità cursore</span>
                <span id="sens-value"></span>
            </div>
            <input type="range" id="sensitivity-slider" min="0.5" max="4.0" step="0.1">
        </div>
    </div>

    </div><!-- #content-touchpad -->

    <div id="content-terminal" class="tab-content">
        <div id="term-error-banner"></div>

        <div id="session-picker">
            <div class="picker-title">sessioni // terminale</div>
            <div id="session-list"></div>
        </div>

        <div id="terminal-active">
            <div id="term-head">
                <button type="button" id="term-back">‹ sessioni</button>
                <span id="term-title"></span>
            </div>
            <div id="xterm-container"></div>
            <!-- Barra tasti: le sequenze sono in TERM_KEYS (app.js). data-repeat =
                 tenendo premuto il tasto si ripete. -->
            <div id="bottom-bar">
                <div class="tkeys">
                    <button class="tkey" data-key="esc">esc</button>
                    <button class="tkey" data-key="tab">tab</button>
                    <button class="tkey mod" data-key="ctrl">ctrl</button>
                    <button class="tkey mod" data-key="alt">alt</button>
                    <button class="tkey arrow" data-key="left" data-repeat aria-label="freccia sinistra">←</button>
                    <button class="tkey arrow" data-key="up" data-repeat aria-label="freccia su">↑</button>
                    <button class="tkey arrow" data-key="down" data-repeat aria-label="freccia giù">↓</button>
                    <button class="tkey arrow" data-key="right" data-repeat aria-label="freccia destra">→</button>
                </div>
                <div class="tkeys">
                    <button class="tkey hot" data-key="ctrl-c" aria-label="ctrl+c, interrompi">^c</button>
                    <button class="tkey hot" data-key="ctrl-d" aria-label="ctrl+d, fine input">^d</button>
                    <button class="tkey hot" data-key="ctrl-z" aria-label="ctrl+z">^z</button>
                    <button class="tkey hot" data-key="ctrl-l" aria-label="ctrl+l, pulisci">^l</button>
                    <button class="tkey" data-key="home">home</button>
                    <button class="tkey" data-key="end">end</button>
                    <button class="tkey" data-key="pgup" data-repeat aria-label="pagina su">pg↑</button>
                    <button class="tkey" data-key="pgdn" data-repeat aria-label="pagina giù">pg↓</button>
                </div>
            </div>
            <input type="text" id="term-kbd-input" autocomplete="off" autocorrect="off" autocapitalize="off">
        </div>
    </div><!-- #content-terminal -->

</body>

</html>
