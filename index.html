<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>LiquidMouse</title>
    <style>
        :root {
            /* Design System: Deep Liquid */
            --bg-color: #2b2e4a;
            --glass-surface: rgba(255, 255, 255, 0.03);
            --text-subtle: rgba(255, 255, 255, 0.3);

            --shadow-out:
                10px 10px 20px rgba(0, 0, 0, 0.35),
                -8px -8px 16px rgba(255, 255, 255, 0.04);

            --shadow-in:
                inset 6px 6px 12px rgba(0, 0, 0, 0.25),
                inset -4px -4px 10px rgba(255, 255, 255, 0.03);

            --active-gold: #ffcc00;
        }

        body {
            margin: 0;
            height: 100vh;
            height: 100dvh;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            user-select: none;
            padding-bottom: env(safe-area-inset-bottom);
            box-sizing: border-box;
        }

        .fluid-panel {
            background: var(--glass-surface);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 35px;
            border: 1px solid rgba(255, 255, 255, 0.02);
            box-shadow: var(--shadow-out);
            transition: all 0.1s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-subtle);
            font-size: 16px;
            font-weight: 500;
        }

        .fluid-pressed {
            box-shadow: var(--shadow-in) !important;
            transform: scale(0.96);
            background: rgba(0, 0, 0, 0.1);
            color: rgba(255, 255, 255, 0.6);
        }

        /* Stile per i tasti "Lucchetto" (Drag, Ctrl, Shift) quando attivi */
        .lock-active {
            background: rgba(255, 204, 0, 0.15) !important;
            border: 1px solid rgba(255, 204, 0, 0.4) !important;
            color: var(--active-gold) !important;
            box-shadow: inset 0 0 15px rgba(255, 204, 0, 0.1) !important;
        }

        #touchpad {
            flex: 1;
            height: auto;
            margin-bottom: 10px;
            touch-action: none;
        }

        .touchpad-container {
            display: flex;
            align-items: stretch;
            width: 95%;
            flex: 1;
            margin-top: 10px;
            margin-bottom: 15px;
            gap: 0;
            min-height: 0;
        }

        .buttons-container {
            width: 95%;
            height: 16%;
            max-height: 120px;
            min-height: 80px;
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 10px;
            flex-shrink: 0;
        }

        .mouse-btn {
            flex: 1;
            height: 100%;
            border-radius: 24px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            font-size: 14px;
        }

        #hidden-input {
            position: absolute;
            top: -2000px;
            opacity: 0;
            font-size: 16px;
        }

        #status {
            position: absolute;
            top: 40px;
            color: var(--text-subtle);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.5;
        }

        #text-display {
            position: fixed;
            top: 80px;
            left: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(136, 255, 204, 0.15);
            border-radius: 16px;
            padding: 12px 16px;
            color: rgba(136, 255, 204, 0.9);
            font-size: 16px;
            font-family: 'Courier New', monospace;
            font-weight: 500;
            min-height: 32px;
            line-height: 1.4;
            display: none;
            z-index: 100;
            box-shadow: 10px 10px 20px rgba(0, 0, 0, 0.1);
        }

        #text-display.active {
            display: block !important;
            animation: slideDown 0.2s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .config-panel {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            color: #ffffff;
        }

        .config-panel.hidden {
            display: none;
        }

        .config-content {
            background: var(--glass-surface);
            backdrop-filter: blur(25px);
            border-radius: 35px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            text-align: center;
            max-width: 90%;
        }

        .config-input {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            padding: 12px 16px;
            color: #ffffff;
            font-size: 16px;
            margin: 20px 0;
            width: 100%;
            box-sizing: border-box;
            outline: none;
        }

        .config-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .config-btn {
            background: rgba(136, 255, 204, 0.2);
            border: 1px solid rgba(136, 255, 204, 0.3);
            border-radius: 12px;
            padding: 12px 24px;
            color: rgba(136, 255, 204, 0.9);
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        /* --- MENU OVERLAY AGGIORNATO (Griglia 3x3) --- */
        #menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(43, 46, 74, 0.4);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 500;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        #menu-overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .arrow-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            width: min(85vw, 350px);
            margin: 0 auto;
            transform: translateY(20px);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #menu-overlay.visible .arrow-grid {
            transform: translateY(0);
        }

        .menu-btn-item {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 25px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            text-align: center;
            cursor: pointer;
        }

        .menu-btn-item svg {
            width: 24px;
            height: 24px;
            margin-bottom: 4px;
        }

        .span-2 {
            grid-column: span 2;
            aspect-ratio: auto;
            height: 80px;
        }
    </style>
</head>

<body>

    <div class="config-panel hidden" id="configPanel">
        <div class="config-content">
            <h1>🖱️ Liquid Mouse</h1>
            <p>Configurazione Indirizzo IP Server Host</p>
            <input type="text" id="ipInput" class="config-input" placeholder="Esempio: 192.168.1.100"
                autocomplete="off">
            <button class="config-btn" id="connectBtn">STABILISCI CONNESSIONE</button>
        </div>
    </div>

    <div id="status">In attesa...</div>
    <div id="text-display"></div>
    <input type="text" id="hidden-input" autocomplete="off" autocorrect="off" autocapitalize="off">

    <div class="touchpad-container">
        <div id="touchpad" class="fluid-panel"></div>
    </div>

    <div class="buttons-container">
        <div id="btn-menu" class="fluid-panel mouse-btn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="2"></circle>
                <circle cx="19" cy="12" r="2"></circle>
                <circle cx="5" cy="12" r="2"></circle>
            </svg>
        </div>
    </div>

    <div id="menu-overlay">
        <div class="arrow-grid">
            <div id="btn-esc" class="fluid-panel menu-btn-item">
                <span style="font-weight: 700; font-size: 13px;">ESC</span>
            </div>
            <div id="btn-copy" class="fluid-panel menu-btn-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
            </div>
            <div id="btn-paste" class="fluid-panel menu-btn-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
                    <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
                </svg>
            </div>

            <div id="btn-ctrl" class="fluid-panel menu-btn-item">
                <span style="font-weight: 700; font-size: 13px;">CTRL</span>
            </div>
            <div id="btn-keyboard" class="fluid-panel menu-btn-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                    stroke-linejoin="round">
                    <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                    <path d="M6 8h.01M10 8h.01M14 8h.01M18 8h.01M6 12h.01M10 12h.01M14 12h.01M18 12h.01M7 16h10" />
                </svg>
            </div>
            <div id="btn-shift" class="fluid-panel menu-btn-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="M12 19V5M5 12l7-7 7 7" />
                </svg>
            </div>

            <div id="btn-select-all" class="fluid-panel menu-btn-item">
                <span style="font-size: 11px; line-height: 1.1;"><b>SELEZIONA</b><br>TUTTO</span>
            </div>
            <div id="btn-win" class="fluid-panel menu-btn-item">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M3 5.5L10.5 4.5V11.5H3V5.5ZM11.5 4.35L21 3V11.5H11.5V4.35ZM3 12.5H10.5V19.5L3 18.5V12.5ZM11.5 12.5H21V21L11.5 19.65V12.5Z"/>
                </svg>
                <span style="font-size: 11px; margin-top: 2px;">WIN</span>
            </div>
            <div id="btn-drag" class="fluid-panel menu-btn-item"
                style="color: #ffcc00; flex-direction: row; gap: 10px;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                <span style="font-weight: bold; font-size: 14px;">TRASCINA</span>
            </div>

            <div id="btn-media-play" class="fluid-panel menu-btn-item span-2">
                <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24" style="margin-right:8px;">
                    <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                </svg>
                <span style="font-weight:bold;font-size:13px;">PLAY / PAUSA</span>
            </div>
            <div id="btn-winv" class="fluid-panel menu-btn-item">
                <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18" style="margin-bottom:2px;">
                    <path d="M3 5.5L10.5 4.5V11.5H3V5.5ZM11.5 4.35L21 3V11.5H11.5V4.35ZM3 12.5H10.5V19.5L3 18.5V12.5ZM11.5 12.5H21V21L11.5 19.65V12.5Z"/>
                </svg>
                <span style="font-size:11px;font-weight:700;">+V</span>
            </div>
        </div>
        <div style="position:absolute;bottom:30px;width:min(85vw,350px);left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.45);font-size:11px;letter-spacing:1px;">
            <div style="display:flex;justify-content:space-between;margin-bottom:6px;text-transform:uppercase;">
                <span>Velocita Cursore</span>
                <span id="sens-value"></span>
            </div>
            <input type="range" id="sensitivity-slider" min="0.5" max="4.0" step="0.1"
                style="width:100%;accent-color:rgba(136,255,204,0.8);cursor:pointer;">
        </div>
    </div>

    <script>
        // --- LOGICA CLIENT ---
        const statusDiv = document.getElementById('status');
        const hiddenInput = document.getElementById('hidden-input');
        const configPanel = document.getElementById('configPanel');
        const ipInput = document.getElementById('ipInput');
        const connectBtn = document.getElementById('connectBtn');
        let ws = null;

        function loadIP() { return localStorage.getItem('liquidMouseIP') || ''; }
        function saveIP(ip) { localStorage.setItem('liquidMouseIP', ip); }

        let reconnectAttempts = 0;
        const MAX_RECONNECTS = 5;

        let connectionTimeout;
        let disconnectHandled = false;

        function closeWS() {
            if (ws) { ws.onclose = null; ws.onerror = null; ws.close(); }
        }

        function connectServer(ip) {
            const _ip = ip.trim();
            if (!_ip) { alert('Inserire un indirizzo IP valido.'); return; }
            if (!/^(\d{1,3}\.){3}\d{1,3}$/.test(_ip) && !/^[a-zA-Z0-9.-]+$/.test(_ip)) {
                alert('Indirizzo non valido.'); return;
            }
            ip = _ip;
            statusDiv.innerText = "CONNESSIONE... "; statusDiv.style.color = "#ffcc00";
            disconnectHandled = false;
            closeWS();

            ws = new WebSocket(`ws://${ip.trim()}:8765`);

            clearTimeout(connectionTimeout);
            connectionTimeout = setTimeout(() => {
                if (ws.readyState !== WebSocket.OPEN && !disconnectHandled) {
                    disconnectHandled = true;
                    ws.onclose = null;
                    ws.onerror = null;
                    ws.close();
                    handleDisconnect(ip);
                }
            }, 3000);

            let pingInterval = null;
            let pingTimestamp = 0;

            ws.onopen = () => {
                clearTimeout(connectionTimeout);
                disconnectHandled = false;
                reconnectAttempts = 0;
                statusDiv.innerText = "CONNESSIONE STABILITA"; statusDiv.style.color = "#88ffcc";
                configPanel.classList.add('hidden'); saveIP(ip.trim());
                // Ping ogni 5s per misurare latenza
                clearInterval(pingInterval);
                pingInterval = setInterval(() => {
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        pingTimestamp = Date.now();
                        ws.send(JSON.stringify({ type: 'ping' }));
                    }
                }, 5000);
            };

            ws.onmessage = (e) => {
                try {
                    const msg = JSON.parse(e.data);
                    if (msg.type === 'pong' && pingTimestamp > 0) {
                        const rtt = Date.now() - pingTimestamp;
                        statusDiv.innerText = `${rtt}ms`;
                        statusDiv.style.color = rtt < 50 ? "#88ffcc" : rtt < 150 ? "#ffcc00" : "#ff6666";
                    }
                } catch (_) {}
            };
            // onerror si limita a pulire il timeout: onclose segue sempre onerror
            ws.onerror = () => { clearTimeout(connectionTimeout); };
            ws.onclose = () => {
                clearTimeout(connectionTimeout);
                clearInterval(pingInterval);
                if (!disconnectHandled) {
                    disconnectHandled = true;
                    handleDisconnect(ip);
                }
            };
        }

        function handleDisconnect(ip) {
            resetLocks();
            if (reconnectAttempts < MAX_RECONNECTS) {
                reconnectAttempts++;
                const delay = Math.min(1500 * Math.pow(1.5, reconnectAttempts - 1), 15000);
                statusDiv.innerText = `RICONNESSIONE (${reconnectAttempts}/${MAX_RECONNECTS})...`;
                statusDiv.style.color = "#ffcc00";
                setTimeout(() => connectServer(ip), delay);
            } else {
                statusDiv.innerText = "DISCONNESSO"; statusDiv.style.color = "#ff6666";
                configPanel.classList.remove('hidden');
            }
        }

        connectBtn.addEventListener('click', () => { reconnectAttempts = 0; connectServer(ipInput.value); });
        ipInput.addEventListener('keyup', (e) => { if (e.key === 'Enter') { reconnectAttempts = 0; connectServer(ipInput.value); } });

        // Gestisce il risveglio dello smartphone (sleep/wake)
        // Forza sempre la riconnessione: dopo sleep la WebSocket può risultare
        // OPEN ma essere in realtà morta (stale), quindi chiudiamo e ricreiamo
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                const ipToConnect = ipInput.value || loadIP();
                if (ipToConnect) {
                    reconnectAttempts = 0;
                    closeWS();
                    connectServer(ipToConnect);
                }
            }
        });

        // Avvio Iniziale Stabile per le WebView
        window.addEventListener('load', () => {
            setTimeout(() => {
                const savedIP = loadIP();
                const currentHostname = window.location.hostname;

                let shouldConnectIP = null;
                if (currentHostname && currentHostname !== 'localhost' && currentHostname !== '127.0.0.1' && currentHostname !== '') {
                    shouldConnectIP = currentHostname;
                } else if (savedIP) {
                    shouldConnectIP = savedIP;
                }

                if (shouldConnectIP) {
                    ipInput.value = shouldConnectIP;
                    connectServer(shouldConnectIP);
                } else {
                    configPanel.classList.remove('hidden');
                }
            }, 300); // Ritardo essenziale per iOS/Android QR Scanner
        });

        // --- SENSIBILITA' CURSORE ---
        // Valore salvato in localStorage, applicato lato client prima dell'invio
        let sensitivity = parseFloat(localStorage.getItem('lm_sensitivity') || '1.8');

        // --- MOVIMENTO CURSORE ---
        let moveX = 0, moveY = 0, isMoving = false;
        let twoFingerScrollAcc = 0;

        function sendLoop() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                if (isMoving && (moveX !== 0 || moveY !== 0)) {
                    ws.send(JSON.stringify({ type: 'move', x: Math.round(moveX * sensitivity), y: Math.round(moveY * sensitivity) }));
                    moveX = 0; moveY = 0; isMoving = false;
                }
                if (Math.abs(twoFingerScrollAcc) >= 1) {
                    const amount = Math.round(twoFingerScrollAcc / 1.5);
                    if (amount !== 0) {
                        ws.send(JSON.stringify({ type: 'scroll', amount: amount }));
                        twoFingerScrollAcc -= amount * 1.5;
                    }
                }
            }
            requestAnimationFrame(sendLoop);
        }
        requestAnimationFrame(sendLoop);

        const pad = document.getElementById('touchpad');
        let lastX = 0, lastY = 0, touchActive = false;
        let twoFingerLastY = 0;

        // --- GESTURE: TAP-TO-CLICK, DOUBLE-TAP, LONG-PRESS ---
        const TAP_MAX_MS   = 200;
        const TAP_MAX_MOVE = 10;
        const LONG_PRESS_MS = 650;

        let tapStartTime = 0, tapStartX = 0, tapStartY = 0;
        let tapMoved = false, longPressTimer = null;

        pad.addEventListener('touchstart', (e) => {
            e.preventDefault();

            if (e.touches.length === 2) {
                // Due dita: prepara scroll, disabilita movimento cursore
                twoFingerLastY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                touchActive = false;
                clearTimeout(longPressTimer);
                tapStartTime = 0;
                return;
            }

            touchActive = true;
            lastX = e.touches[0].clientX;
            lastY = e.touches[0].clientY;
            moveX = 0; moveY = 0;

            tapStartTime = Date.now();
            tapStartX = lastX;
            tapStartY = lastY;
            tapMoved = false;

            longPressTimer = setTimeout(() => {
                if (!tapMoved) {
                    sendClick('right');
                    if (navigator.vibrate) navigator.vibrate(60);
                    tapStartTime = 0; // evita tap-to-click dopo long press
                }
            }, LONG_PRESS_MS);
        }, { passive: false });

        pad.addEventListener('touchmove', (e) => {
            e.preventDefault();

            if (e.touches.length === 2) {
                const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                twoFingerScrollAcc += (midY - twoFingerLastY) * 0.375;
                twoFingerLastY = midY;
                return;
            }

            if (!touchActive) return;
            const cx = e.touches[0].clientX, cy = e.touches[0].clientY;

            if (Math.abs(cx - tapStartX) > TAP_MAX_MOVE || Math.abs(cy - tapStartY) > TAP_MAX_MOVE) {
                tapMoved = true;
                clearTimeout(longPressTimer);
            }

            moveX += (cx - lastX); moveY += (cy - lastY);
            isMoving = true; lastX = cx; lastY = cy;
        }, { passive: false });

        pad.addEventListener('touchend', () => {
            touchActive = false;
            clearTimeout(longPressTimer);

            const duration = Date.now() - tapStartTime;
            if (duration < TAP_MAX_MS && !tapMoved && tapStartTime > 0) {
                // Tap rapido = click sinistro (il doppio tap produce due click = double-click OS)
                sendClick('left');
            }
            tapStartTime = 0;
        }, { passive: false });

        pad.addEventListener('touchcancel', () => {
            touchActive = false;
            clearTimeout(longPressTimer);
            tapStartTime = 0;
        }, { passive: false });

        // --- CLICK ---
        const sendClick = (btn) => {
            if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'click', btn: btn }));
        };

        // --- MENU E LOCKS ---
        const btnMenu = document.getElementById('btn-menu');
        const menuOverlay = document.getElementById('menu-overlay');

        // Stati Tasti Lock
        let locks = { drag: false, ctrl: false, shift: false };

        function resetLocks() {
            locks = { drag: false, ctrl: false, shift: false };
            updateLockUI('btn-drag', false);
            updateLockUI('btn-ctrl', false);
            updateLockUI('btn-shift', false);
        }

        function toggleLock(key, btnId) {
            locks[key] = !locks[key];
            const isActive = locks[key];
            updateLockUI(btnId, isActive);

            if (navigator.vibrate) navigator.vibrate(50);

            if (ws && ws.readyState === WebSocket.OPEN) {
                if (key === 'drag') {
                    ws.send(JSON.stringify({ type: 'drag', state: isActive ? 'down' : 'up' }));
                    // Feedback visivo sul bottone menu principale se drag è attivo
                    if (isActive) btnMenu.classList.add('lock-active'); else btnMenu.classList.remove('lock-active');
                } else {
                    ws.send(JSON.stringify({ type: 'key_toggle', key: key, state: isActive ? 'down' : 'up' }));
                }
            }
            // Meglio chiudere sempre per pulizia, l'utente vede lo stato dal bottone.
            closeMenu();
        }

        function updateLockUI(id, active) {
            const el = document.getElementById(id);
            if (active) el.classList.add('lock-active'); else el.classList.remove('lock-active');
        }

        btnMenu.addEventListener('click', () => menuOverlay.classList.add('visible'));
        menuOverlay.addEventListener('click', (e) => {
            if (e.target === menuOverlay) menuOverlay.classList.remove('visible');
        });
        function closeMenu() { menuOverlay.classList.remove('visible'); }

        // Helper: registra touchend (no 300ms delay iOS) con fallback click per mouse/desktop.
        // e.preventDefault() su touchend impedisce il click sintetico successivo.
        function addMenuTap(id, handler) {
            const el = document.getElementById(id);
            let moved = false;
            el.addEventListener('touchstart', () => { moved = false; }, { passive: true });
            el.addEventListener('touchmove',  () => { moved = true;  }, { passive: true });
            el.addEventListener('touchend', (e) => {
                if (!moved) { e.preventDefault(); handler(); }
            });
            el.addEventListener('click', handler); // fallback desktop/mouse
        }

        const send = (msg) => {
            if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(msg));
        };

        // Gestione Bottoni Menu
        addMenuTap('btn-drag',  () => toggleLock('drag',  'btn-drag'));
        addMenuTap('btn-ctrl',  () => toggleLock('ctrl',  'btn-ctrl'));
        addMenuTap('btn-shift', () => toggleLock('shift', 'btn-shift'));

        addMenuTap('btn-esc', () => {
            send({ type: 'key', key: 'esc' });
            updateTextDisplay("ESC"); closeMenu();
        });

        addMenuTap('btn-copy', () => {
            send({ type: 'hotkey', keys: ['ctrl', 'c'] });
            updateTextDisplay("COPIA"); closeMenu();
        });

        addMenuTap('btn-paste', () => {
            send({ type: 'hotkey', keys: ['ctrl', 'v'] });
            updateTextDisplay("INCOLLA"); closeMenu();
        });

        addMenuTap('btn-select-all', () => {
            send({ type: 'hotkey', keys: ['ctrl', 'a'] });
            updateTextDisplay("ALL"); closeMenu();
        });

        addMenuTap('btn-win', () => {
            send({ type: 'key', key: 'win' });
            updateTextDisplay("WIN"); closeMenu();
        });

        addMenuTap('btn-media-play', () => {
            send({ type: 'key', key: 'media_play_pause' });
            closeMenu();
        });

        addMenuTap('btn-winv', () => {
            send({ type: 'hotkey', keys: ['win', 'v'] });
            updateTextDisplay("WIN+V"); closeMenu();
        });

        // --- SLIDER SENSIBILITA' ---
        const sensSlider = document.getElementById('sensitivity-slider');
        const sensValue  = document.getElementById('sens-value');
        sensSlider.value = sensitivity;
        sensValue.textContent = sensitivity.toFixed(1) + 'x';
        sensSlider.addEventListener('input', () => {
            sensitivity = parseFloat(sensSlider.value);
            sensValue.textContent = sensitivity.toFixed(1) + 'x';
            localStorage.setItem('lm_sensitivity', sensitivity);
        });

        // --- DISPLAY TESTO & TASTIERA ---
        const textDisplay = document.getElementById('text-display');
        let displayedText = ''; let displayTimeout;
        let previousValue = '';

        function updateTextDisplay(char) {
            displayedText = (char.length > 1) ? char : (char === '⌫' ? displayedText.slice(0, -1) : (char === '↵' ? displayedText + '\n' : displayedText + char));
            textDisplay.textContent = displayedText;
            textDisplay.classList.add('active');
            clearTimeout(displayTimeout);
            displayTimeout = setTimeout(() => { textDisplay.classList.remove('active'); displayedText = ''; }, 3000);
        }

        addMenuTap('btn-keyboard', () => {
            hiddenInput.value = '';
            previousValue = ''; // Reset essenziale: evita ghost input al riavvio della tastiera
            hiddenInput.focus();
            closeMenu();
        });
        hiddenInput.addEventListener('input', (e) => {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;
            const val = hiddenInput.value;
            if (val.length > previousValue.length) {
                const added = val.substring(previousValue.length);
                ws.send(JSON.stringify({ type: 'text', char: added })); updateTextDisplay(added);
            } else if (val.length < previousValue.length) {
                const del = previousValue.length - val.length;
                for (let i = 0; i < del; i++) { ws.send(JSON.stringify({ type: 'key', key: 'backspace' })); updateTextDisplay('⌫'); }
            }
            previousValue = val;
        });

        hiddenInput.addEventListener('keydown', (e) => {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;
            if (e.key === 'Enter') {
                e.preventDefault(); ws.send(JSON.stringify({ type: 'key', key: 'enter' }));
                updateTextDisplay('↵'); previousValue = ''; hiddenInput.value = '';
            } else if (e.key === 'Backspace') {
                if (hiddenInput.value.length === 0) {
                    // Campo vuoto: 'input' non scatta, invia backspace manualmente
                    ws.send(JSON.stringify({ type: 'key', key: 'backspace' })); updateTextDisplay('⌫');
                }
                // Campo non vuoto: l'evento 'input' gestisce la cancellazione
            }
        });

        // --- EFFETTI TOUCH UI ---
        ['btn-menu', 'touchpad'].forEach(id => {
            const el = document.getElementById(id);
            el.addEventListener('touchstart', () => el.classList.add('fluid-pressed'), { passive: true });
            el.addEventListener('touchend', () => el.classList.remove('fluid-pressed'), { passive: true });
        });
        document.querySelectorAll('.menu-btn-item').forEach(el => {
            el.addEventListener('touchstart',  () => el.classList.add('fluid-pressed'),    { passive: true });
            el.addEventListener('touchend',    () => el.classList.remove('fluid-pressed'), { passive: true });
            el.addEventListener('touchcancel', () => el.classList.remove('fluid-pressed'), { passive: true });
        });

    </script>
</body>

</html>
