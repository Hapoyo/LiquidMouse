version: 2
updates:
  # Le dipendenze di requirements.txt ricevono una PR quando esce una versione
  # nuova: i test (anche su Windows) dicono subito se qualcosa si rompe.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # websockets 17 richiede Python >= 3.11, il progetto supporta ancora
      # la 3.10: la PR fallirebbe sempre su windows (3.10).
      - dependency-name: websockets
        versions: [">=17"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
