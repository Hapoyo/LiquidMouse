name: Build LiquidMouse

on:
  push:
    tags:
      - 'v*'
  # Avvio manuale (anche via API): senza input produce solo l'EXE come
  # artifact; con pubblica=true crea anche tag e release v<VERSION> sul commit.
  # Serve perché il progetto si lavora solo tramite Claude Code, e da lì il
  # push dei tag non passa: la release deve poter partire da GitHub.
  workflow_dispatch:
    inputs:
      pubblica:
        description: 'Pubblica la release v<VERSION> (crea il tag sul commit di main)'
        type: boolean
        default: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Installa dipendenze
        run: pip install pyinstaller -r requirements.txt

      - name: Estrai versione
        id: version
        shell: bash
        run: |
          VERSION=$(python -c "import re; m=re.search(r'VERSION\s*=\s*\"([^\"]+)\"', open('liquidmouse/version.py',encoding='utf-8').read()); print(m.group(1) if m else 'dev')")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Versione dichiarata: $VERSION"

      # Senza questo controllo, taggare v2.4.0 con VERSION = "2.3.0" pubblica in
      # silenzio una release v2.4.0 contenente LiquidMouse_v2.3.0.exe.
      - name: Verifica che il tag combaci con VERSION
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          if [ "$TAG" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag v$TAG != VERSION ${{ steps.version.outputs.version }} in liquidmouse/version.py"
            exit 1
          fi

      # Pubblicazione manuale: solo da main, e mai sopra un tag che esiste già
      # (softprops aggiornerebbe in silenzio la release precedente).
      - name: Verifica la pubblicazione manuale
        if: github.event_name == 'workflow_dispatch' && inputs.pubblica
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::La release si pubblica solo da main (ref: $GITHUB_REF)"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Il tag v$VERSION esiste già: aggiorna VERSION in liquidmouse/version.py"
            exit 1
          fi

      - name: Build EXE
        run: python -m PyInstaller --clean --log-level WARN --distpath EXE LiquidMouse.spec

      - name: Rinomina EXE con versione
        shell: bash
        run: mv EXE/LiquidMouse.exe "EXE/LiquidMouse_v${{ steps.version.outputs.version }}.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: LiquidMouse-v${{ steps.version.outputs.version }}
          path: EXE/LiquidMouse_v${{ steps.version.outputs.version }}.exe

      # Con il push di un tag, tag_name coincide con il tag (verificato sopra).
      # Con la pubblicazione manuale il tag non esiste ancora: la release lo
      # crea su target_commitish. Un tag creato con GITHUB_TOKEN non fa
      # ripartire questo workflow, quindi niente doppia build.
      - name: Crea Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.pubblica)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Liquid Mouse v${{ steps.version.outputs.version }}
          files: EXE/LiquidMouse_v${{ steps.version.outputs.version }}.exe
          generate_release_notes: true
