name: Build LiquidControl

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa dipendenze
        run: pip install websockets pystray Pillow qrcode pyinstaller cryptography pywinpty miniupnpc

      - name: Estrai versione
        id: version
        shell: bash
        run: |
          VERSION=$(python -c "import re; m=re.search(r'VERSION\s*=\s*\"([^\"]+)\"', open('liquidmouse/version.py',encoding='utf-8').read()); print(m.group(1) if m else 'dev')")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Versione dichiarata: $VERSION"

      # Senza questo controllo, taggare v2.4.0 con VERSION = "2.3.0" pubblica in
      # silenzio una release v2.4.0 contenente LiquidControl_v2.3.0.exe.
      - name: Verifica che il tag combaci con VERSION
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          if [ "$TAG" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag v$TAG != VERSION ${{ steps.version.outputs.version }} in liquidmouse/version.py"
            exit 1
          fi

      - name: Build EXE
        run: python -m PyInstaller --clean --log-level WARN --distpath EXE LiquidControl.spec

      - name: Rinomina EXE con versione
        shell: bash
        run: mv EXE/LiquidControl.exe "EXE/LiquidControl_v${{ steps.version.outputs.version }}.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiquidControl-v${{ steps.version.outputs.version }}
          path: EXE/LiquidControl_v${{ steps.version.outputs.version }}.exe

      - name: Crea Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: EXE/LiquidControl_v${{ steps.version.outputs.version }}.exe
          generate_release_notes: true
